[project]
name = "placidway-assesment"
version = "0.1.0"
description = "PlacidWay Medical Tourism Grounded Knowledge Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "libsql-client>=0.3.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "pydantic>=2.10.0",
    "pydantic-ai>=2.62.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.12.0",
    "rich>=13.0.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ragas>=0.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
